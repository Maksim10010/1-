<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Automation Studio</title>
<style>
  :root { --bg: #0a0a0f; --card: rgba(255,255,255,0.05); --accent: #00f2fe; --text: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body {
    background: radial-gradient(circle at top right, #1a1a2e, #0a0a0f);
    color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .container { max-width: 1000px; padding: 40px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; }
  .hero-text h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; }
  .hero-text h1 span { background: linear-gradient(90deg, var(--accent), #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-text p { color: #a0a0b0; font-size: 1.2rem; margin-bottom: 30px; }
  .btn {
    display: inline-block; padding: 15px 35px; border-radius: 30px; background: linear-gradient(90deg, var(--accent), #4facfe);
    color: #000; font-weight: bold; text-decoration: none; transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,242,254,0.3); }
  .glass-card {
    background: var(--card); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
    padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .glass-card h3 { margin-bottom: 15px; font-size: 1.5rem; }
  .glass-card ul { list-style: none; }
  .glass-card ul li { margin-bottom: 15px; display: flex; align-items: center; gap: 10px; color: #d0d0e0; }
  .glass-card ul li::before { content: '✦'; color: var(--accent); }
  @media (max-width: 768px) { .container { grid-template-columns: 1fr; text-align: center; } }
</style>
</head>
<body>
  <div class="container">
    <div class="hero-text">
      <h1>Автоматизируй <span>бизнес</span> с помощью ИИ</h1>
      <p>Вайб-кодинг, умные боты и интеграция нейросетей для вашей рутины. Быстро. Надежно. Технологично.</p>
      <a href="#" class="btn">Обсудить проект</a>
    </div>
    <div class="glass-card">
      <h3>Что я делаю:</h3>
      <ul>
        <li>Разработка Telegram-ботов</li>
        <li>Скрипты для парсинга и Excel</li>
        <li>Создание лендингов на ИИ</li>
        <li>Интеграция ChatGPT в CRM</li>
      </ul>
    </div>
  </div>
</body>
</html>
